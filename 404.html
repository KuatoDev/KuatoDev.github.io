<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 - Page Not Found | Vern Kuato">
  <meta name="theme-color" content="#0a1628">
  <link rel="manifest" href="manifest.json">
  <title>404 - Page Not Found | Vern Kuato</title>
  <link rel="icon" href="assets/logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background-wrapper" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header>
    <nav>
      <div class="logo">
        <a href="index.html" aria-label="Vern Kuato Home">
          <img src="assets/logo.svg" alt="Vern Kuato Logo" width="40" height="40">
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html#blog">Articles</a></li>
        <li><a href="index.html#projects">Portfolio</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" style="min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="card glass-card" style="text-align: center; max-width: 520px; width: 100%; padding: 3rem 2rem; border-radius: 20px;">
      <div style="font-size: 5rem; font-weight: 800; line-height: 1; margin-bottom: 1rem; background: linear-gradient(135deg, var(--primary-accent), var(--orb-3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        404
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text-main);">
        Lost in Cyberspace
      </h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6;">
        The page you are looking for has been relocated, deleted, or never existed in this sector.
      </p>
      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; padding: 0.75rem 1.5rem; font-weight: 600;">
          <span class="material-icons" style="font-size: 20px;" aria-hidden="true">home</span>
          Back to Home
        </a>
        <a href="blog.html" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; padding: 0.75rem 1.5rem; font-weight: 600;">
          <span class="material-icons" style="font-size: 20px;" aria-hidden="true">article</span>
          Explore Blog
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; <span id="footerYear"></span> Vern Kuato. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
