<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog Vern Kuato - Writing about mobile OS, Android development, and Tech News.">
  <meta name="theme-color" content="#0a1628">
  <link rel="canonical" href="https://vernkuato.zone.id/blog.html">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vernkuato.zone.id/blog.html">
  <meta property="og:title" content="Blog - Vern Kuato">
  <meta property="og:description" content="Writing about mobile OS, Android development, and Tech News.">
  <meta property="og:image" content="https://vernkuato.zone.id/assets/profile.webp">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://vernkuato.zone.id/blog.html">
  <meta name="twitter:title" content="Blog - Vern Kuato">
  <meta name="twitter:description" content="Writing about mobile OS, Android development, and Tech News.">
  <meta name="twitter:image" content="https://vernkuato.zone.id/assets/profile.webp">

  <link rel="manifest" href="manifest.json">
  <title>Blog - Vern Kuato</title>
  <link rel="icon" href="assets/logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Vern Kuato's Blog",
    "url": "https://vernkuato.zone.id/blog.html",
    "description": "Writing about mobile OS, Android development, and Tech News.",
    "publisher": {
      "@type": "Person",
      "name": "Vern Kuato",
      "url": "https://vernkuato.zone.id/"
    }
  }
  </script>
</head>
<body>

  <a href="#articlesContainer" class="skip-link">Skip to articles</a>

  <div class="background-wrapper" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="toolbar-area">
    <a href="index.html" class="back-btn">
      <span class="material-icons" aria-hidden="true">arrow_back</span> Back to Home
    </a>
  </div>

  <section class="hero" style="height: auto; min-height: 35vh; padding-top: clamp(80px, 12vh, 120px); padding-bottom: 20px;" aria-label="Blog header">
    <h1>Vern's <span style="color: var(--primary-accent);">Blog</span></h1>
    <p>Writing about mobile OS and Tech News</p>
  </section>

  <!-- Search & Tag Filter Controls -->
  <section class="blog-controls-section" aria-label="Search and filter articles">
    <div class="blog-controls-container">
      <div class="blog-search-box">
        <span class="material-icons search-icon" aria-hidden="true">search</span>
        <input type="text" id="blogSearchInput" placeholder="Search articles or tags…" aria-label="Search articles or tags">
        <button id="blogSearchClear" class="clear-search-btn" aria-label="Clear search" style="display:none;">
          <span class="material-icons" aria-hidden="true">close</span>
        </button>
      </div>
      <div class="blog-tags-filter" id="blogTagsContainer" role="toolbar" aria-label="Filter by category tag">
        <button class="tag-chip active" data-tag="all">All</button>
      </div>
    </div>
  </section>

  <section class="about" style="padding-top: 10px;" aria-label="Articles">
    <div class="blog-list" id="articlesContainer">
      <p style="color: var(--text-muted); text-align:center; width:100%;">Loading articles...</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
